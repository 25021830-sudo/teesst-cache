name: Optimized CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    # 1. Áp dụng Matrix để test đa nền tảng
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          # 2. Cấu hình Caching: Tự động lưu thư mục ~/.m2/repository
          cache: 'maven'

      - name: Thực thi Unit Test
        # Lần chạy đầu tiên sẽ tải dependency, lần sau sẽ dùng cache
        run: mvn test